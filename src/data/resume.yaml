  paragraphs:
    - >-
      I'm a full stack developer with over 12 years of cumulative work experience.
      I've worked on a range of topics from designing scalable systems
      to analyzing big data, across big tech and early stage startups.
      I'm proficient in Javascript (React, Typescript, Node, React Native),
